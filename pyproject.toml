[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-llm-systems"
version = "0.1.0"
description = "Local-first LLM inference, optimization, and serving experiments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
ml = ["torch>=2.5", "transformers>=4.46,<6"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
llm-lab = "enterprise_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
